version: "3.9"

services:
  backend:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always
    environment:
      APP_ENV: production

  worker:
    restart: always
    command: celery -A app.workers.celery_app worker --loglevel=warning --concurrency=8

  beat:
    restart: always

  frontend:
    command: nginx -g "daemon off;"
    restart: always
